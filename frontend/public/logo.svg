<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <defs>
    <radialGradient id="purpleBlob" cx="40%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9B87F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5B47C8" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="tealBlob" cx="60%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#60E6B8" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#28B885" stop-opacity="0.80"/>
    </radialGradient>
  </defs>

  <!-- Purple circle / blob -->
  <ellipse cx="44" cy="46" rx="34" ry="34" fill="url(#purpleBlob)"/>

  <!-- Teal circle / blob (overlapping) -->
  <ellipse cx="72" cy="54" rx="30" ry="30" fill="url(#tealBlob)" opacity="0.88"/>

  <!-- Magnifying glass ring (dark) -->
  <circle cx="76" cy="62" r="18" fill="none" stroke="#1A1830" stroke-width="8"/>
  <!-- Handle -->
  <line x1="89" y1="75" x2="104" y2="92" stroke="#1A1830" stroke-width="8" stroke-linecap="round"/>
</svg>
